<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Maze Jones – Temple of the Golden Idols</title>
  <meta name="description"
    content="Maze Jones: Navigate treacherous temple corridors, collect golden idols, and escape before time runs out!" />
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body,
    html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #0d0906;
      font-family: 'Courier New', monospace;
    }

    #gameCanvas {
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    canvas {
      image-rendering: pixelated;
      image-rendering: crisp-edges;
    }
  </style>
  <!-- Phaser 3 CDN -->
  <script src="https://cdn.jsdelivr.net/npm/phaser@3.55.2/dist/phaser.min.js"></script>
</head>

<body>
  <div id="gameCanvas"></div>
  <script type="module" src="src/main.js"></script>
</body>

</html>
